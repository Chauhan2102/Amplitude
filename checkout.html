  <div id="site-header"></div><main class="page-main"><div class="simple-heading"><span class="eyebrow">SECURE CHECKOUT</span><h1>Complete your order</h1></div>
    <div class="checkout-layout"><form id="checkout-form" class="checkout-form">
      <section class="checkout-section"><div class="step-number">01</div><div><h2>Shipping information</h2><div class="form-grid"><label>Full name<input name="name" required></label><label>Phone<input name="phone" required></label><label class="span-two">Address<input name="address" required></label><label>City<input name="city" required></label><label>State<input name="state" required></label><label>Pincode<input name="pincode" pattern="[0-9]{6}" maxlength="6" required></label></div></div></section>
      <section class="checkout-section"><div class="step-number">02</div><div><h2>Payment information</h2><div class="payment-note">🔒 Your payment details are securely handled for this demo checkout.</div><div class="form-grid"><label class="span-two">Cardholder name<input name="cardName" required></label><label class="span-two">Card number<input name="card" inputmode="numeric" minlength="12" maxlength="19" placeholder="1234 5678 9012 3456" required></label><label>Expiry<input name="expiry" placeholder="MM/YY" required></label><label>CVV<input name="cvv" inputmode="numeric" maxlength="4" required></label></div></div></section>
      <button class="btn btn-dark full" type="submit">Place order</button>
    </form><aside id="checkout-summary" class="checkout-summary"></aside></div>
  </main><div id="site-footer"></div><script src="js/app.js"></script><script>initCheckout();</script>
